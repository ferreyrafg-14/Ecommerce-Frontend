<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión o Registrase</title>
    <link rel="stylesheet" href="../assets/css/output.css">
</head>
<body>
    <main class="flex flex-col items-center">
       <div>
        <p>Iniciar sesión</p>
       </div>

       <div>

            <div>
                <label for="email">Correo electrónico</label><br>
                <input id="email" name="email" type="text" placeholder="ejemplo@correo.com">
            </div>

            <div>
                <label for="password">Contraseña</label><br>
                <input id="password" name="password" type="password" placeholder="Ingresá tu contrasena">
            </div>

       </div>

       <div class="flex justify-between gap-2">
         <div>
            <input type="checkbox" id="remember" name="remember">
            <label for="remember">Recordarme</label>
         </div>

            <div>
                <a href="#">¿Olviaste tu contraseña?</a>
            </div>
       </div>
    </main>
</body>
</html>
